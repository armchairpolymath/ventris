name: Release

# Push a tag like v0.1.0 to build installers for every OS and publish a GitHub Release.
# "Run workflow" (manual) builds the same files as downloadable artifacts, without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest }
          - { name: macos-arm64, os: macos-latest }
          - { name: macos-x86_64, os: macos-15-intel }
          - { name: linux-x86_64, os: ubuntu-22.04 }
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 file
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller pillow
      - name: Run tests
        run: python -m unittest
      - name: Build and smoke-test the app
        run: python packaging/build.py --smoke
      - uses: actions/upload-artifact@v4
        with:
          name: ventris-${{ matrix.name }}
          path: dist/release/*
          if-no-files-found: error

  wheel:
    name: Python wheel and sdist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: ventris-python
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, wheel]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la artifacts
          (cd artifacts && sha256sum * > SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "Ventris $GITHUB_REF_NAME" \
            --notes-file packaging/release-notes.md
